// Copy this file to baseq3/openmohaa-lean.cfg and run: exec openmohaa-lean.cfg
// Add that exec line to your autoexec.cfg to keep these personal bindings.
seta cl_run 1
seta cg_fov 80
seta cg_autoswitch 0
seta sensitivity 1.029863
seta g_localArsenal 1
seta g_localGodMode 1
seta g_botHealth 1000
seta bot_enable 1
seta bot_minplayers 6
seta vm_game 0
seta vm_cgame 0
seta vm_ui 0
// Local games need this to load the matching native lean client.
seta sv_pure 0
bind SHIFT "+leanleft"
bind SPACE "+leanright"
bind f "+moveup"
bind c "toggle cl_run"
bind x "+movedown"
bind k "toggle cg_drawviewmodel 0 2"
