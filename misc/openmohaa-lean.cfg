// Copy this file to baseq3/openmohaa-lean.cfg and run: exec openmohaa-lean.cfg
// Add that exec line to your autoexec.cfg to keep these personal bindings.
seta cl_run 1
seta cg_fov 80
seta vm_game 0
seta vm_cgame 0
bind SHIFT "+leanleft"
bind SPACE "+leanright"
bind f "+moveup"
bind c "toggle cl_run"
bind x "+movedown"
