name: Client builds

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux x64 client
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_CLIENT=ON -DBUILD_SERVER=OFF
          -DBUILD_GAME_LIBRARIES=ON -DBUILD_GAME_QVMS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Package client and native game modules
        run: |
          cp misc/openmohaa-lean.cfg build/Release/baseq3/
          cp misc/openmohaa-lean.cfg build/Release/missionpack/
          tar -C build/Release -czf ioq3-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ioq3-linux-x64
          path: ioq3-linux-x64.tar.gz
          if-no-files-found: error

  windows-x64:
    name: Windows x64 client
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_CLIENT=ON -DBUILD_SERVER=OFF
          -DBUILD_GAME_LIBRARIES=ON -DBUILD_GAME_QVMS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package client and native game modules
        shell: pwsh
        run: |
          Copy-Item misc/openmohaa-lean.cfg build/Release/baseq3/
          Copy-Item misc/openmohaa-lean.cfg build/Release/missionpack/
          Compress-Archive -Path build/Release/* -DestinationPath ioq3-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ioq3-windows-x64
          path: ioq3-windows-x64.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple silicon client
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DBUILD_CLIENT=ON -DBUILD_SERVER=OFF
          -DBUILD_GAME_LIBRARIES=ON -DBUILD_GAME_QVMS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Package client and native game modules
        run: |
          cp misc/openmohaa-lean.cfg build/Release/baseq3/
          cp misc/openmohaa-lean.cfg build/Release/missionpack/
          tar -C build/Release -czf ioq3-macos-arm64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ioq3-macos-arm64
          path: ioq3-macos-arm64.tar.gz
          if-no-files-found: error
